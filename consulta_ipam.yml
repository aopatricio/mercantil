---
- name: Automação phpIPAM via Conexão Direta MySQL (AWX Ready)
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # --- DADOS DE CONEXÃO AO BANCO ---
    db_host: "{{ var_db_host }}"
    db_port: "{{ var_db_port }}"
    db_name: "phpipam"

    # --- PARÂMETROS DA OPERAÇÃO (AWX Extra Vars / Survey) ---
    #target_ip: "172.20.36.200"
    #ip_description: "Servidor Cadastrado via AWX"
    #operation: "add" # "add" ou "delete"
    target_ip: "{{ target_ip | default('172.20.36.200') }}"
    ip_description: "{{ ip_description | default('Servidor Cadastrado via AWX') }}"
    operation: "{{ operation | default('add') }}"
    
  tasks:
    - name: Garantir que o pymysql está instalado no Python do AWX
      ansible.builtin.pip:
        name: pymysql
        state: present

    # ----------------------------------------------------------------------
    # 1. VERIFICAÇÃO INICIAL E BUSCA DA SUBNET
    # ----------------------------------------------------------------------
    - name: Consultar IP e calcular Subnet correspondente no MySQL
      ansible.mysql.mysql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_db: "{{ db_name }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        query:
          - >
            SELECT id, subnetId, ip_addr, description 
            FROM ipaddresses 
            WHERE ip_addr = INET_ATON('{{ target_ip }}') 
               OR ip_addr = CAST(INET_ATON('{{ target_ip }}') AS CHAR)
               OR ip_addr = '{{ target_ip }}';
          - >
            SELECT id, subnet, mask 
            FROM subnets 
            WHERE INET_ATON('{{ target_ip }}') BETWEEN subnet AND (subnet + POW(2, 32 - mask) - 1);
      register: db_lookup
      no_log: false

    - name: Normalizar retorno da consulta MySQL
      ansible.builtin.set_fact:
        raw_queries: "{{ db_lookup.query_result | default(db_lookup.executed_queries | default([])) }}"

    - name: Definir variáveis de estado do IP e Subnet
      ansible.builtin.set_fact:
        ip_in_use: "{{ (raw_queries[0] | default([])) | length > 0 }}"
        ip_details: "{{ raw_queries[0][0] if ((raw_queries[0] | default([])) | length > 0) else {} }}"
        subnet_id: "{{ raw_queries[1][0]['id'] if ((raw_queries[1] | default([])) | length > 0) else None }}"

    # ----------------------------------------------------------------------
    # 2. FLUXO DE ADIÇÃO DE IP (operation == 'add')
    # ----------------------------------------------------------------------
    - name: "[ADD] Alertar se IP já estiver em uso"
      ansible.builtin.debug:
        msg:
          - "------------------------------------------------"
          - "ALERTA: O IP {{ target_ip }} JÁ ESTÁ EM USO!"
          - "Descrição: {{ ip_details.description | default('Sem descrição') }}"
          - "Subnet ID: {{ ip_details.subnetId | default('N/A') }}"
          - "------------------------------------------------"
      when:
        - operation == "add"
        - ip_in_use

    - name: "[ADD] Falhar se Nenhuma Subnet Compatível for Encontrada"
      ansible.builtin.fail:
        msg: "ERRO: O IP {{ target_ip }} não pertence a nenhuma sub-rede cadastrada no phpIPAM."
      when:
        - operation == "add"
        - not ip_in_use
        - subnet_id is none

    - name: "[ADD] Inserir IP no banco phpIPAM"
      ansible.mysql.mysql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_db: "{{ db_name }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        query:
          - >
            INSERT INTO ipaddresses
            (subnetId, ip_addr, description, dns_name, mac, owner, state, switch, port, note, editDate)
            VALUES (
              {{ subnet_id }},
              INET_ATON('{{ target_ip }}'),
              '{{ ip_description }}',
              '', '', '', 1, 0, '', '', NOW()
            );
      no_log: true
      when:
        - operation == "add"
        - not ip_in_use
        - subnet_id is not none
      register: db_insert

    - name: "[ADD] Exibir confirmação de cadastro"
      ansible.builtin.debug:
        msg: "SUCESSO: IP {{ target_ip }} cadastrado no phpIPAM na Subnet ID {{ subnet_id }}!"
      when:
        - operation == "add"
        - not ip_in_use
        - db_insert is changed

    # ----------------------------------------------------------------------
    # 3. FLUXO DE REMOÇÃO DE IP (operation == 'delete')
    # ----------------------------------------------------------------------
    - name: "[DELETE] Remover IP do phpIPAM"
      ansible.mysql.mysql_query:
        login_host: "{{ db_host }}"
        login_port: "{{ db_port }}"
        login_db: "{{ db_name }}"
        login_user: "{{ db_user }}"
        login_password: "{{ db_password }}"
        query:
          - >
            DELETE FROM ipaddresses 
            WHERE ip_addr = INET_ATON('{{ target_ip }}') 
               OR ip_addr = CAST(INET_ATON('{{ target_ip }}') AS CHAR)
               OR ip_addr = '{{ target_ip }}';
      no_log: false
      when:
        - operation == "delete"
        - ip_in_use
      register: db_delete

    - name: "[DELETE] Exibir confirmação de remoção"
      ansible.builtin.debug:
        msg: "SUCESSO: O IP {{ target_ip }} foi removido do phpIPAM (Linhas afetadas: {{ db_delete.executed_queries[0] | default('N/A') }})."
      when:
        - operation == "delete"
        - ip_in_use

    - name: "[DELETE] Alertar se IP não foi encontrado para remoção"
      ansible.builtin.debug:
        msg: "AVISO: O IP {{ target_ip }} não existia no phpIPAM. Nenhuma alteração feita."
      when:
        - operation == "delete"
        - not ip_in_use
